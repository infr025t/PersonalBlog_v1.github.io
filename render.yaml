services:
  - type: web
    name: yiyu-blog
    runtime: node
    plan: starter
    buildCommand: node --check server/index.mjs
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    disk:
      name: blog-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_DISPLAY_NAME
        value: 站长
